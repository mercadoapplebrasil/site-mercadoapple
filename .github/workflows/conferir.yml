name: Conferir o site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pillow
      - run: node --check assets/app.js
      - run: python3 tools/check.py
